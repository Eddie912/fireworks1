<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>粒子心跳</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 50% 48%, rgba(174, 27, 77, 0.24), transparent 32%),
        radial-gradient(circle at 14% 18%, rgba(63, 20, 92, 0.22), transparent 38%),
        linear-gradient(145deg, #05060d 0%, #100617 54%, #04050b 100%);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    #heartCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      margin: 0;
      transform: translateX(-50%);
      color: rgba(255, 224, 235, 0.62);
      font-size: 12px;
      letter-spacing: 0.16em;
      white-space: nowrap;
      user-select: none;
    }

    #fallback {
      position: fixed;
      inset: 50% auto auto 50%;
      width: min(86vw, 420px);
      margin: 0;
      transform: translate(-50%, -50%);
      color: #ffe5ef;
      line-height: 1.7;
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas" aria-hidden="true"></canvas>
  <p class="hint" aria-hidden="true">移动或点击，让心跳回应你</p>
  <p id="fallback" hidden>当前浏览器无法显示爱心动画。</p>
  <p id="description" class="sr-only">装饰性粒子爱心动画。画面中的粒子会汇聚成爱心并轻柔跳动。</p>
  <script></script>
</body>
</html>
